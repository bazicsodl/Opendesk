version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: opendesk
    restart: always
    environment:
      POSTGRES_USER: opendesk
      POSTGRES_PASSWORD: opendesk_pass
      POSTGRES_DB: opendesk_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
